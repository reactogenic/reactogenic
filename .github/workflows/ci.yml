name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      # The builder's tests (go/internal/build/...) resolve react, react-dom and
      # @reactogenic/ui from the root's node_modules, build the docs site
      # (site/), and run what they built in Node: the differential test of
      # the renderer (specs/phase02/plan.md, RGP2-011), the behaviours'
      # scripts (RGP2-022).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build vendored tsgo
        run: go build github.com/microsoft/TypeScript/tsc/...
      - name: Vet
        run: go vet github.com/reactogenic/reactogenic/go/...
      - name: Test
        # -race: tsgo parses files in parallel. -timeout: the builder's packages
        # run an interpreter (the embedded engine) under the race detector.
        run: go test -race -timeout 30m github.com/reactogenic/reactogenic/go/...
      - name: gofmt
        run: test -z "$(gofmt -l go/cmd go/internal)"
      - name: Every fork file is upstream's or in a patch
        run: go/scripts/check-patches.sh
      - name: Build without the workspace
        run: GOWORK=off go build ./cmd/reactogenic # go/ is a module on its own (RGP1-003)
        working-directory: go

  vendor:
    # The committed tsgo tree must equal upstream at UPSTREAM's commit + go/patches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-vendor and compare
        run: |
          go/scripts/sync-tsgo.sh
          git status --porcelain -- go/third_party/tsgo | tee /dev/stderr | (! grep .)

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # the Vite plugin's tests build the Go binary
        with:
          go-version-file: go/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: grammar # the committed .rtsx grammar is what its generator writes (RGP1-109)
        run: pnpm --filter rtsx generate:check
      - run: pnpm typecheck
      - run: pnpm test:js

  vscode:
    # The editor suite (RGP1-110): the extension and the binary of this commit
    # in a real VS Code, isolated profile, five windows (packages/vscode/DEVELOPMENT.md).
    # Not a required check of the `main` ruleset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the binary
        run: go build -o "$RUNNER_TEMP/reactogenic" ./cmd/reactogenic
        working-directory: go
      - name: Editor suite
        run: xvfb-run -a pnpm --filter rtsx test:editor # VS Code needs a display
        env:
          REACTOGENIC_BINARY: ${{ runner.temp }}/reactogenic

  site:
    # The docs site, built by the builder of this commit (specs/phase02/plan.md,
    # RGP2-040 and RGP2-060): any diagnostic fails the job, and the byte report
    # is its artifact. Not a required check of the `main` ruleset.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # named, so that a step fails when the left side of a pipe does
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The build resolves react, react-dom and @reactogenic/ui from the site's
      # node_modules; it runs no Node.
      - run: pnpm install --frozen-lockfile
      - name: Build the binary
        run: go build -o "$RUNNER_TEMP/reactogenic" ./cmd/reactogenic
        working-directory: go
      # Without --report the build prints its diagnostics and then one line,
      # "4 pages written to dist" (builder.md): a second line is a diagnostic.
      # The exit status alone would let a warning through — it is 0 with one.
      - name: Build the site, with no diagnostic
        run: |
          "$RUNNER_TEMP/reactogenic" build | tee "$RUNNER_TEMP/build.txt"
          test "$(wc -l < "$RUNNER_TEMP/build.txt")" -eq 1
        working-directory: site
      - name: The byte report
        run: |
          mkdir "$RUNNER_TEMP/site-report"
          "$RUNNER_TEMP/reactogenic" build --report | tee "$RUNNER_TEMP/site-report/report.txt"
          cp dist/_rg/report.json "$RUNNER_TEMP/site-report/"
        working-directory: site
      - uses: actions/upload-artifact@v4
        with:
          name: site-report # report.json as the build wrote it, report.txt as --report printed it
          path: ${{ runner.temp }}/site-report
          if-no-files-found: error
